# BOARD=rpi0w — Raspberry Pi Zero W.
#
# Pulled in by the build's conf/auto.conf, which the Makefile writes for the selected BOARD and
# KERNEL. Parse order: btbench-device.conf (through the layer's layer.conf), then auto.conf and so
# this file, then local.conf, the machine conf and the distro conf last. A value this file must own
# is a hard `=`; a per-bench override belongs in local.conf.
#
# The kernel-dependent settings use the btbench-kernel-<next|rpi> override, which the distro adds
# to DISTROOVERRIDES from BTBENCH_KERNEL.

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
# KERNEL=next (default): bluetooth-next, built by meta-btbench's linux-btbench from the revision in
# versions.conf (or src/linux with SRC=local). The mainline device tree for the board, with the
# bench's dtsi compiled in; the firmware loads it by name (device_tree= below), and it has no
# overlays: what the bench needs from them (dwc2 as a USB device) is in the dtsi.
PREFERRED_PROVIDER_virtual/kernel:btbench-kernel-next = "linux-btbench"
KERNEL_DEVICETREE:btbench-kernel-next = "${BTBENCH_DTBS}"
RPI_EXTRA_CONFIG:btbench-kernel-next = "\n# bluetooth-next: the mainline device tree (the firmware would pick bcm2708-rpi-zero-w.dtb)\ndevice_tree=bcm2835-rpi-zero-w.dtb\n"

# Mainline names the mini-UART on the GPIO header after its DT alias: serial1 → ttyS1 (the
# downstream kernel's "serial0" console alias does not exist there).
SERIAL_CONSOLES:btbench-kernel-next = "115200;ttyS1"
CMDLINE_SERIAL:btbench-kernel-next = "console=ttyS1,115200"
# dwc_otg is the downstream driver; mainline has dwc2.
CMDLINE_DWC_OTG:btbench-kernel-next = ""

# KERNEL=rpi: the Raspberry Pi fork, for comparison. 6.12 is the newest meta-raspberrypi carries.
PREFERRED_VERSION_linux-raspberrypi = "6.12.%"
ENABLE_DWC2_PERIPHERAL:btbench-kernel-rpi = "1"
RPI_EXTRA_CONFIG:btbench-kernel-rpi = "\n# Bluetooth on the PL011 through the kernel's serdev driver\ndtparam=krnbt=on\n"

# ---------------------------------------------------------------------------
# Boot: firmware → U-Boot → kernel
# ---------------------------------------------------------------------------
# U-Boot is there for kernel trials: `btbench-kernel try` sets bench_try=1 in its environment and
# meta-btbench's boot.scr boots /boot/bench/test once, then the good kernel again whatever happens
# (see docs/kernel.md). The kernel stays a zImage, booted with bootz: a uImage of a multi-platform
# ARM kernel needs a fixed load address.
RPI_USE_U_BOOT = "1"
KERNEL_IMAGETYPE_UBOOT = "zImage"
KERNEL_BOOTCMD = "bootz"

# Root by PARTUUID: mainline and downstream do not number the SD card's mmc device alike.
# The disk id is fixed in wic/btbench-rpi.wks.
CMDLINE_ROOT_PARTITION = "PARTUUID=b7be4c4e-02"

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------
# Headless, 512 MB: the GPU gets the minimum.
DISABLE_VC4GRAPHICS = "1"
GPU_MEM = "16"

# Serial console on the GPIO header (115200 8N1, GPIO14/15): the mini-UART, since the PL011 is the
# Bluetooth radio's. enable_uart=1 also pins the core clock the mini-UART's baud rate depends on.
ENABLE_UART = "1"

# The Wi-Fi firmware (linux-firmware-rpidistro) is behind LICENSE_FLAGS = "synaptics-killswitch".
# The machine config only recommends it: without this the blob is quietly left out and Wi-Fi fails
# at runtime with no error at build time.
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
BTBENCH_WKS = "btbench-rpi.wks"
