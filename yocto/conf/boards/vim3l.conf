# BOARD=vim3l — Khadas VIM3L (Amlogic S905D3, arm64), on meta-meson's khadas-vim3l machine.
#
# Parsed before the machine conf (see rpi0w.conf for the order), so a hard `=` here wins over the
# machine's `?=`, but not over its own hard assignments: those are overridden with :append or
# :remove, which apply after every assignment.

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
# bluetooth-next (linux-btbench) as an arm64 Image, booted with booti by the bench's boot.scr. The
# machine would build a FIT image (kernel-fitimage) of linux-yocto.
PREFERRED_PROVIDER_virtual/kernel = "linux-btbench"
KERNEL_IMAGETYPE = "Image"
KERNEL_CLASSES = " kernel-uimage "
KERNEL_DEVICETREE:btbench-kernel-next = "${BTBENCH_DTBS}"

# The command line boot.scr gives both kernel slots. ttyAML0 is the UART_AO on the 40-pin header
# (pins 18/19, 115200 8N1); the root by PARTUUID like the Raspberry Pis (wic/btbench-meson.wks).
BTBENCH_CMDLINE = "console=ttyAML0,115200 root=PARTUUID=b7be4c4e-02 rootfstype=ext4 rootwait net.ifnames=0"

# ---------------------------------------------------------------------------
# Boot: ROM → Amlogic BL2/BL3x → U-Boot → boot.scr → kernel
# ---------------------------------------------------------------------------
# meta-meson's image class writes u-boot.bin.sd.bin (Amlogic's blobs around mainline U-Boot) into
# the first 1 MB or so of the card, around the partition table; the boot partition starts at 4 MB.
# The bench's U-Boot keeps its environment in uboot.env (meta-btbench's u-boot bbappend) and boots
# btbench-boot-scr's boot.scr. The machine's IMAGE_BOOT_FILES is a hard "${KERNEL_IMAGETYPE}"; the
# dtb goes next to the kernel under its basename, where btbench-kernel's good slot expects it.
EXTRA_IMAGEDEPENDS += "btbench-boot-scr"
IMAGE_BOOT_FILES:append = " ${@' '.join(os.path.basename(t) for t in d.getVar('BTBENCH_DTBS').split())} boot.scr"

# ---------------------------------------------------------------------------
# Firmware
# ---------------------------------------------------------------------------
# meson64's machine conf makes every board's image carry nine Broadcom Wi-Fi firmware packages and
# the video decoder's: none of them is this board's chip. Its BCM4359 firmware and Bluetooth patch
# come from btbench-firmware-vim3l instead (the image installs BTBENCH_BOARD_FIRMWARE).
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = " \
    linux-firmware-bcm4329 linux-firmware-bcm4330 linux-firmware-bcm4335 linux-firmware-bcm43362 \
    linux-firmware-bcm43430 linux-firmware-bcm43430a0 linux-firmware-bcm43455 linux-firmware-bcm4354 \
    linux-firmware-bcm4356 linux-firmware-amlogic-vdec \
"
BTBENCH_BOARD_FIRMWARE = "btbench-firmware-vim3l"

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
BTBENCH_WKS = "btbench-meson.wks"
