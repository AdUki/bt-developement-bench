# BOARD=rpi5 — Raspberry Pi 5 (arm64) with an Intel BE200 on an M.2 HAT. See rpi0w.conf for the
# parse order and the reasoning behind the settings the Pis share; only what differs is commented
# here.

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
# KERNEL=next: the mainline device tree of the stepping boards/rpi5.mk picked (RPI5_SOC), with
# the bench's dtsi compiled in, named in config.txt: the firmware would look for its own names.
PREFERRED_PROVIDER_virtual/kernel:btbench-kernel-next = "linux-btbench"
KERNEL_DEVICETREE:btbench-kernel-next = "${BTBENCH_DTBS}"
RPI_EXTRA_CONFIG:btbench-kernel-next = "${BTBENCH_RPI5_CONFIG}\n# bluetooth-next: the mainline device tree for this board's SoC stepping (RPI5_SOC)\ndevice_tree=${@os.path.basename(d.getVar('BTBENCH_DTBS'))}\n"

# Two UARTs, each with a getty. The debug UART is the 3-pin JST connector between the HDMI ports
# (115200 8N1; uart10, the dts's serial10 alias): ttyAMA10 under both kernels, where the firmware
# (uart_2ndstage, below) and U-Boot print. The 40-pin header's GPIO 14/15, pins 8/10, is the RP1's
# uart0: ttyAMA0 under both kernels (the bench's dtsi adds it for mainline, dtparam=uart0_console
# for the downstream kernel), what a plain USB-serial adapter is wired to.
#
# bluetooth-next's log goes to the header. The PL011 driver has one console for all its ports, and the
# first port a console= names gets it, so only one of the two can carry the log. The header's comes
# up with the RP1 behind PCIe, about half a second into the boot, and replays the log from the
# start. Not with an earlycon on the command line: printk then skips the replay, taking the boot
# console for the same device. And the header cannot be an earlycon itself: an access to its UART
# (0x1f00030000) before the kernel's PCIe driver has set the link up stalls the bus, silently, even
# with the firmware's enable_rp1_uart=1. A kernel that panics before the RP1 is up says why in
# pstore on the next boot. With a cable on the JST connector, `console=ttyAMA10,115200 earlycon` in its
# place puts the log there from the kernel's first instructions.
SERIAL_CONSOLES = "115200;ttyAMA10 115200;ttyAMA0"
CMDLINE_SERIAL = "console=ttyAMA0,115200"
CMDLINE_DWC_OTG:btbench-kernel-next = ""

# config.txt lines both kernels get. os_check=0: before it boots a partition, the Pi 5 bootloader
# checks it for a device tree the board can use, by the firmware's own names (bcm2712-rpi-5-b.dtb,
# bcm2712d0-rpi-5-b.dtb). One it rejects is skipped for the next boot mode, and at the end of
# BOOT_ORDER the bootloader restarts: a reboot loop with no kernel output. KERNEL=next ships only
# mainline's names (bcm2712-d-rpi-5-b.dtb), named in device_tree=, so the check is left out.
BTBENCH_RPI5_CONFIG = "\n# The firmware's log on the debug UART\nuart_2ndstage=1\n# Boot the mainline device tree, whose name the bootloader does not know\nos_check=0\n"

# KERNEL=rpi: the USB-C port's dwc2 as a peripheral through the firmware's overlay, and the
# external PCIe connector (the M.2 HAT), which the downstream dts leaves off.
PREFERRED_VERSION_linux-raspberrypi = "6.12.%"
# The D0 stepping's device tree, which the firmware loads on a D0 board when the partition has it
# (meta-raspberrypi's list has only the C1's, bcm2712-rpi-5-b.dtb).
RPI_KERNEL_DEVICETREE:append:btbench-kernel-rpi = " broadcom/bcm2712d0-rpi-5-b.dtb"
ENABLE_DWC2_PERIPHERAL:btbench-kernel-rpi = "1"
RPI_EXTRA_CONFIG:btbench-kernel-rpi = "${BTBENCH_RPI5_CONFIG}\n# The M.2 HAT on the PCIe FFC connector\ndtparam=pciex1\n# A console on the 40-pin header's GPIO 14/15 too (the RP1's uart0, ttyAMA0)\ndtparam=uart0=on\ndtparam=uart0_console\n"
CMDLINE_SERIAL:btbench-kernel-rpi = "console=ttyAMA10,115200 console=ttyAMA0,115200"

# ---------------------------------------------------------------------------
# Boot: firmware (in the board's EEPROM) → U-Boot → kernel
# ---------------------------------------------------------------------------
# U-Boot 2025.04 from meta-lts-mixins (boards/rpi5.mk BSP_LAYERS), as kernel_2712.img.
RPI_USE_U_BOOT = "1"
KERNEL_IMAGETYPE_UBOOT = "Image"
KERNEL_BOOTCMD = "booti"

CMDLINE_ROOT_PARTITION = "PARTUUID=b7be4c4e-02"

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------
DISABLE_VC4GRAPHICS = "1"
ENABLE_UART = "1"
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# The BE200: its Bluetooth firmware (ibt-0291-0291, also the VIM3L's second adapter) and its Wi-Fi
# firmware for iwlwifi. The CYW43455's come from the machine's MACHINE_EXTRA_RRECOMMENDS.
BTBENCH_BOARD_FIRMWARE = "btbench-firmware-ibt btbench-firmware-iwlwifi"

# ffmpeg (BTBENCH_FFMPEG): poky's. meta-raspberrypi defaults every Pi to rpidistro-ffmpeg, which is
# built with the VideoCore's MMAL, and the Pi 5 has none (its configure stops at "mmal not found").
PREFERRED_PROVIDER_ffmpeg = "ffmpeg"
PREFERRED_PROVIDER_libav = "ffmpeg"
PREFERRED_PROVIDER_libpostproc = "ffmpeg"

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
BTBENCH_WKS = "btbench-rpi.wks"
