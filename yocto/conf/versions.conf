# The upstream revisions the image is built from. Required by every build dir's auto.conf.
#
# The dev trees in src/ move on; the image does not until these do. `make bump-versions` writes
# the current HEAD of each src/ tree here, so the next `make image` (and `make sdk`) carries what
# you have been deploying by hand. `make image SRC=local` builds from src/ without pinning.
#
# Every component comes from the bench's fork on GitHub: upstream's master (bluetooth-next's for
# the kernel), and a branch bench with the bench's commits on top, which is what src/<comp> (a
# submodule) has checked out (docs/dev.md "The forks").
#
# bluetooth-next is rebased onto net-next and is sometimes broken: bump it on purpose, never
# follow it blindly (no AUTOREV).

BTBENCH_BLUEZ_GIT          = "git://github.com/AdUki/bluez.git;protocol=https"
BTBENCH_BLUEZ_SRCREV       = "0d96a5263bee5d1c5aca11768c836a8754c73139"
BTBENCH_BLUEZ_PV           = "5.87+git"
BTBENCH_PIPEWIRE_GIT       = "git://github.com/AdUki/pipewire.git;protocol=https"
BTBENCH_PIPEWIRE_SRCREV    = "bab98a8d3c7dcbc7e7da041b2064a71a3cb478c9"
BTBENCH_PIPEWIRE_PV        = "1.6.9+git"
BTBENCH_WIREPLUMBER_GIT    = "git://github.com/AdUki/wireplumber.git;protocol=https"
BTBENCH_WIREPLUMBER_SRCREV = "81606cbb32d29df20147d1b68b662c1082654d81"
BTBENCH_WIREPLUMBER_PV     = "0.5.18"
BTBENCH_LINUX_GIT          = "git://github.com/AdUki/linux.git;protocol=https"
BTBENCH_LINUX_SRCREV       = "336446f3ba196032bffbe9acc911c4b10bfcdf17"
BTBENCH_LINUX_PV           = "7.3-rc2+git"
