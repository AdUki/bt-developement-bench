# The bcm2835 watchdog driver and the wdt command, for boot.scr.
CONFIG_WDT=y
CONFIG_WDT_BCM2835=y
CONFIG_CMD_WDT=y
# Not started on every boot: only boot.scr's trial path starts it. A normal boot is left to
# systemd (RuntimeWatchdogSec), and a U-Boot prompt left open does not reset the board.
# CONFIG_WATCHDOG_AUTOSTART is not set
