# U-Boot's environment in /boot/uboot.env: the FAT partition of the SD card. U-Boot numbers the
# VIM3L's controllers by their order in the device tree: mmc 0 is the SDIO Wi-Fi, mmc 1 the SD
# card, mmc 2 the eMMC. The size stays the defconfig's 0x2000, which fw_env.config repeats.
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="1:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_FAT_WRITE=y
