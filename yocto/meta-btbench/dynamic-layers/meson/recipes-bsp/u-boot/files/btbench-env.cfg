# U-Boot's environment in /boot/uboot.env: the FAT partition of the card U-Boot booted from. U-Boot
# numbers the VIM3L's controllers by their order in the device tree: mmc 0 is the SDIO Wi-Fi, mmc 1
# the SD card, mmc 2 the eMMC. ":1" is partition 1 of the boot device (the board's
# mmc_get_env_dev()), so the environment that Linux's /boot holds is the one U-Boot reads, on the SD
# card and on the eMMC alike. The size stays the defconfig's 0x2000, which fw_env.config repeats.
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART=":1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_FAT_WRITE=y
# The defconfig's ENV_IS_NOWHERE stays off: as a second location, it loads U-Boot's defaults when
# uboot.env is missing and becomes where saveenv saves, so the file is never created.
# CONFIG_ENV_IS_NOWHERE is not set
