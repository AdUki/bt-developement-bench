# network-online.target is reached when any link is online, and never waits more than 30 s.
# The default waits for every managed link — the gadget link only has a carrier while a PC is
# plugged in, Wi-Fi may be the setup AP or off — and would hold up anything ordered after
# network-online.target for two minutes.
[Service]
ExecStart=
ExecStart=@SYSTEMD_UNITDIR@/systemd-networkd-wait-online --any --timeout=30
