[Unit]
# Host keys must be generated early too, otherwise the early sshd has nothing to offer. The root
# filesystem is read-only, so btbench-sshkeys keeps them on /data (or, without /data, in /run for
# this boot): after /data is mounted, when it is.
DefaultDependencies=no
After=systemd-remount-fs.service data.mount

[Service]
ExecStart=
ExecStart=/usr/bin/btbench-sshkeys
