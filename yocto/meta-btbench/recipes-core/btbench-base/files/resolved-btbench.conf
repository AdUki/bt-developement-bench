# systemd-resolved answers <hostname>.local on the links whose .network says MulticastDNS=yes
# (usb0, wlan0). That needs mDNS on globally too, and poky builds systemd with it off when the
# distro has "zeroconf" (it expects avahi). Avahi is not installed: resolved alone does the job.
[Resolve]
MulticastDNS=yes
LLMNR=no
