# dnsmasq is in the image for btbench-wifi, which runs its own instance — DNS only, on the setup
# AP's address only — while the AP is up. The package's own service would listen on port 53 on
# every interface and answer as a forwarder; it is held off here rather than disabled, so a
# reinstall of the package (make pkg) cannot turn it back on.
[Unit]
ConditionPathExists=/etc/btbench/enable-dnsmasq-service
