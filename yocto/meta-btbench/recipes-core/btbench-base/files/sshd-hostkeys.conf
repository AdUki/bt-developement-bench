# The host keys btbench-sshkeys keeps on /data (the root filesystem is read-only): /run/btbench/ssh
# points at them. Listing any HostKey replaces sshd's default /etc/ssh ones.
HostKey /run/btbench/ssh/ssh_host_ed25519_key
HostKey /run/btbench/ssh/ssh_host_ecdsa_key
HostKey /run/btbench/ssh/ssh_host_rsa_key
