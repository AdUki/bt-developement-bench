# Drop-in, pulled in by the "Include /etc/ssh/sshd_config.d/*.conf" line of OE's sshd_config.
# Shipping our own /etc/ssh/sshd_config instead would collide with the file openssh-sshd owns.
#
# Root logs in with the key from the device conf (the deploy targets do), or with its password.
# A bench on the USB link or a lab network, not a server.
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords no
