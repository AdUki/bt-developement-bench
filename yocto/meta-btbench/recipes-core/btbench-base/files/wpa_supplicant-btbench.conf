# The networks are on /data, managed by btbench-wifi (add/remove), not in /etc/wpa_supplicant:
# they survive deploys and kernel swaps, and the root filesystem stays what the image made it.
# btbench-wifi starts and stops this unit; nothing enables it.
[Unit]
After=data.mount btbench-data.service

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c /data/btbench/wifi/wpa_supplicant-wlan0.conf -i wlan0
