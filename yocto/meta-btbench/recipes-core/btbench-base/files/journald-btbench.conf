# The journal in RAM (/run/log/journal), uncompressed. A one-core ARMv6 spends seconds opening,
# interleaving and decompressing an on-disk journal of a few archives for every read (the console's
# log viewer, journalctl), and the SD card takes every write. The price: it is gone at each reboot,
# a failed kernel trial included (docs/kernel.md). Capped well inside /run, which is 20% of RAM.
[Journal]
Storage=volatile
Compress=no
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
