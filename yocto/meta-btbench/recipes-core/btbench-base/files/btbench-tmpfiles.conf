# Runtime state of the bench's scripts (btbench-wifi's wifi.json and wifi-scan.json, ...).
d /run/btbench 0755 root root -
# btbenchd's RAM folders (obexd's root, the cover art it serves) are not for the 10-day cleaning
# of /tmp: a board without a clock makes them at boot with the time at 2025, NTP then sets the
# time, and the cleaner would take the empty folders for old and remove them while obexd needs
# them. The logs and captures keep their own times and are written on, so they stay anyway.
x /tmp/btbench
x /tmp/btbench-cover
