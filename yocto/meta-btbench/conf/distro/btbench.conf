# The bench's distro: poky with systemd, made for a board you develop on rather than ship.
require conf/distro/poky.conf

DISTRO = "btbench"
DISTRO_NAME = "Bluetooth development bench"
DISTRO_VERSION = "1.0"
SDK_VENDOR = "-btbenchsdk"

# Keep poky's override (recipes and layers key on it), and add the kernel choice so a board conf
# can say KERNEL_DEVICETREE:btbench-kernel-next = ...
DISTROOVERRIDES = "poky:btbench:btbench-kernel-${BTBENCH_KERNEL}"
BTBENCH_KERNEL ??= "next"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " bluetooth wifi zeroconf pam"
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl ptest nfc 3g"

# No syslog daemon: the journal is the log, and it is persistent (btbench-base), so a trial kernel
# that hung can be read back with `journalctl -b -1`.
VIRTUAL-RUNTIME_base-utils-syslog = ""
# Persistent means /var/log on disk: poky's default makes it a link into the /var/volatile tmpfs,
# where Storage=persistent would write a journal that is gone at the next boot. Global, not per
# recipe: base-files, systemd and every package's file permissions follow it.
VOLATILE_LOG_DIR = "no"

# BlueZ, PipeWire and WirePlumber come from meta-btbench's git recipes at the revisions in
# yocto/conf/versions.conf; the release recipes of oe-core/meta-oe lose to them on version alone,
# these just say so out loud.
PREFERRED_VERSION_bluez5 = "${BTBENCH_BLUEZ_PV}"
PREFERRED_VERSION_pipewire = "${BTBENCH_PIPEWIRE_PV}"
PREFERRED_VERSION_wireplumber = "${BTBENCH_WIREPLUMBER_PV}"

# AAC needs fdk-aac (LICENSE_FLAGS "commercial"). Opt-in, from btbench-device.conf.
LICENSE_FLAGS_ACCEPTED += "${@'commercial' if d.getVar('BTBENCH_AAC') == '1' else ''}"

# `make pkg` serves this build's ipk feed to the board through an ssh reverse tunnel, so on the
# board the feed is always on localhost.
PACKAGE_FEED_URIS = "http://127.0.0.1:8000"
