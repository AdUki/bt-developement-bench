BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "btbench"
BBFILE_PATTERN_btbench = "^${LAYERDIR}/"
BBFILE_PRIORITY_btbench = "10"

# Board-independent: the daemon, the image, the dev-oriented recipes and the bench plumbing. What
# only makes sense on top of one BSP layer lives under dynamic-layers/<its collection>/ and is
# parsed only when that layer is in BBLAYERS — which is how one layer serves every board (the
# Makefile's BOARD picks the BSP).
LAYERDEPENDS_btbench = "core openembedded-layer meta-python networking-layer multimedia-layer"
LAYERSERIES_COMPAT_btbench = "scarthgap"

BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bbappend \
"

# The device-specific settings (hostname, password, ssh key, Wi-Fi) live here so nobody has to
# edit a recipe to build an image for a different bench. Board settings do not: they are in
# yocto/conf/boards/, pulled in through the build's auto.conf.
require ${LAYERDIR}/conf/btbench-device.conf
