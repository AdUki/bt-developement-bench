# wireplumber.service drop-in from meta-btbench (wireplumber_git.bb).
#
# The system-wide WirePlumber runs as user pipewire, whose home is /. Its state (the chosen
# default sink and source, device profiles, stream volumes) would go to /.local/state, which it
# cannot write, so nothing would be remembered across restarts. Give it /var/lib/wireplumber.
[Service]
StateDirectory=wireplumber
Environment=XDG_STATE_HOME=%S
