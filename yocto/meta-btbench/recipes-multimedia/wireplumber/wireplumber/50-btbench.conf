# WirePlumber settings for the bench (meta-btbench, wireplumber_git.bb).
#
# WirePlumber runs system-wide here (wireplumber.service, user pipewire, profile main-systemwide),
# on a board with no desktop session. Upstream's defaults are in
# /usr/share/wireplumber/wireplumber.conf; this fragment says only what the bench needs on top.
#
# Fragments merge: objects key by key, arrays are concatenated. A later fragment that wants to
# replace one of the lists below wholesale has to name the section "override.<section>".

wireplumber.profiles = {
  # No logind on a headless board: the seat monitoring would wait for an active seat that never
  # comes, and keep the Bluetooth monitor from starting. main-systemwide (the unit's profile)
  # already says so; this also covers a WirePlumber started by hand with the default profile.
  main = {
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
  main-systemwide = {
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  # Every role PipeWire implements except HSP: classic A2DP both ways, LE Audio (BAP unicast) both
  # ways, and both ends of HFP. HSP is left out as upstream does: some headsets misbehave when HSP
  # AG and HFP AG are offered side by side.
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]

  # The codecs PipeWire may offer and accept, by its names for them. The list names everything
  # PipeWire 1.6 knows; codecs this build does not have (aptX and LDAC unless
  # BTBENCH_EXTRA_CODECS, AAC unless BTBENCH_AAC, LC3plus) are simply ignored. It is here to be
  # trimmed: a codec missing from the list is neither registered as an endpoint nor offered, so
  # deleting a name is the quickest way to force a device onto another codec.
  #   A2DP:  sbc sbc_xq aac aac_eld aptx aptx_hd aptx_ll aptx_ll_duplex ldac faststream
  #          faststream_duplex lc3plus_hr opus_05 opus_05_51 opus_05_71 opus_05_duplex opus_05_pro
  #          opus_g
  #   BAP:   lc3
  #   HFP:   cvsd msbc lc3_swb lc3_a127
  #   ASHA:  g722
  bluez5.codecs = [
    sbc sbc_xq aac aac_eld aptx aptx_hd aptx_ll aptx_ll_duplex ldac faststream faststream_duplex
    lc3plus_hr opus_05 opus_05_51 opus_05_71 opus_05_duplex opus_05_pro opus_g
    lc3
    cvsd msbc lc3_swb lc3_a127
    g722
  ]

  # HFP is PipeWire's own implementation; there is no oFono or hsphfpd on the image.
  bluez5.hfphsp-backend = "native"
}
