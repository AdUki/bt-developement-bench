# PipeWire daemon settings for the bench (meta-btbench, pipewire_git.bb). Upstream's defaults are
# in /usr/share/pipewire/pipewire.conf; a fragment here only says what differs.

context.properties = {
    # Let the graph run at 44.1 kHz as well as 48 kHz. Most A2DP sources (phones) and many sinks
    # negotiate 44.1 kHz; with 48 kHz alone every such stream is resampled, which on the ARM11 of a
    # Zero W costs more CPU than the SBC codec itself and puts the resampler's latency and
    # artefacts into whatever is being measured. snd-aloop runs at any rate, so nothing else
    # needs converting either.
    default.clock.allowed-rates = [ 44100 48000 ]
}
