# PipeWire on the Raspberry Pi Zero W only (pipewire_git.bb installs it for BTBENCH_BOARD = rpi0w).
#
# The real-time audio thread (PipeWire's data loop) runs just under the kernel's interrupt threads
# (SCHED_FIFO 50) rather than at upstream's 88 above them. On the Zero W's single core a codec
# busy at the upstream priority starved the SD card's interrupt thread until the card timed out
# ("sdhost-bcm2835: timeout waiting for hardware interrupt", the data partition's journal aborted)
# and kept the Bluetooth UART's work waiting. Audio still runs before every ordinary thread. The
# boards with more cores do not need it.
module.rt.args = {
    rt.prio = 40
}
