# The ALSA loopback card (snd-aloop): the board's sound card. The Zero W has no analog audio
# under the mainline kernel, and a loopback is what a Bluetooth audio bench wants anyway: what is
# played to hw:Loopback,0 can be captured from hw:Loopback,1 and the other way round, so a stream
# from a phone can be recorded and checked, and a test signal can be fed to a speaker.
snd-aloop
