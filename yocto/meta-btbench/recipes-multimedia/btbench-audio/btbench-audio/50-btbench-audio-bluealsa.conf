# Drop-in from meta-btbench (btbench-audio): BlueALSA belongs to audio mode "bluealsa".
#
# The After= orders nothing at boot (PipeWire and BlueALSA never start together); on a switch it
# makes systemd stop the PipeWire units before BlueALSA starts, or BlueALSA after PipeWire, so the
# two never register endpoints with bluetoothd at the same time.
[Unit]
PartOf=btbench-audio-bluealsa.target
After=pipewire.service wireplumber.service
