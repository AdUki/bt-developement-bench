# btbench: systemd feeds the SoC watchdog for as long as it runs. A kernel that hangs (a trial
# kernel above all) stops feeding it and the board resets; U-Boot then boots the good kernel.
#
# 15 s is the most the bcm2835 watchdog can count (0xfffff ticks of 1/65536 s); systemd feeds it
# every 7.5 s.
[Manager]
RuntimeWatchdogSec=15
