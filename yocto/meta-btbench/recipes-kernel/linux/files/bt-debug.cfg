# Bluetooth kernel logging that can be switched on at runtime (merged after btbench.cfg by
# linux-btbench; docs/kernel.md "Kernel Bluetooth logs").
#
# Every BT_DBG / pr_debug in net/bluetooth and drivers/bluetooth is compiled in and off, and
# switched per file, function or module through dynamic debug — `btbench-btdebug on l2cap smp`,
# the console's System → Logs and tools, `make bt-debug AREAS="l2cap"`. Off costs a no-op branch
# per call site; nothing is printed until asked for.

# debugfs: /sys/kernel/debug/dynamic_debug/control, and /sys/kernel/debug/bluetooth (connection,
# key and parameter state per controller).
CONFIG_DEBUG_FS=y
CONFIG_DYNAMIC_DEBUG=y
CONFIG_BT_DEBUGFS=y
# BT_FEATURE_DEBUG (the debug switch in the experimental-features mgmt interface) is not here: it
# depends on !DYNAMIC_DEBUG, and dynamic debug does the same per file, function or line.

# Timestamps on every line (messages from BT_DBG carry none of their own), and room for a burst:
# 256 KiB of log buffer instead of 128, so a connection's worth of L2CAP or SMP lines is still
# there when dmesg or journald reads it.
CONFIG_PRINTK_TIME=y
CONFIG_LOG_BUF_SHIFT=18
