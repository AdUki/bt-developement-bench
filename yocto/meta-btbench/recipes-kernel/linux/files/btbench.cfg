# The bench's kernel configuration, on top of the board's defconfig.
#
# One fragment for every kernel the bench builds: linux-btbench (bluetooth-next, merged with
# scripts/kconfig/merge_config.sh), the linux-raspberrypi bbappend (a kernel-yocto config
# fragment) and `make linux` (merge_config.sh again). So it only names symbols both trees have;
# a value that does not survive olddefconfig is reported in the build log (linux-btbench,
# make linux).
#
# What the bench develops is built as modules: a rebuilt bluetooth.ko or hci_uart.ko can be put
# in place and reloaded on a running kernel of the same release, without a trial boot.

# ---------------------------------------------------------------------------
# Kernel release: <version>-btbench-<git revision>, see linux-btbench_git.bb
# ---------------------------------------------------------------------------
CONFIG_LOCALVERSION_AUTO=y

# ---------------------------------------------------------------------------
# Bluetooth
# ---------------------------------------------------------------------------
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_LE_L2CAP_ECRED=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=m
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=m
# The HCI vendor extensions BlueZ uses on controllers that have them (USB dongles).
CONFIG_BT_MSFTEXT=y
CONFIG_BT_AOSPEXT=y
# /sys/kernel/debug/bluetooth: connection, key and parameter state.
CONFIG_BT_DEBUGFS=y
# BT_FEATURE_DEBUG (the debug switch in the experimental-features mgmt interface) is not here: it
# depends on !DYNAMIC_DEBUG, and dynamic debug does the same per file, function or line:
#   echo 'module bluetooth +p' > /sys/kernel/debug/dynamic_debug/control

# The onboard controller: hci_uart on the PL011, bound through serdev from the device tree
# (brcm,bcm43438-bt), with the Broadcom setup (firmware download, baud rate switch). BCM selects
# H4 and btbcm.
CONFIG_SERIAL_DEV_BUS=y
CONFIG_SERIAL_DEV_CTRL_TTYPORT=y
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIUART_BCM=y
CONFIG_BT_HCIUART_3WIRE=y
# A USB dongle on the OTG port in host mode (no gadget link then); the BCM43430 has no ISO, so
# LE Audio needs a dongle or vhci.
CONFIG_BT_HCIBTUSB=m
# Virtual controllers: btvirt, the BlueZ testers (mgmt-tester, l2cap-tester, iso-tester, ...).
CONFIG_BT_HCIVHCI=m

# HoG and HID over BR/EDR through bluetoothd (uhid), and raw access to the resulting devices.
CONFIG_UHID=m
CONFIG_HIDRAW=y

# bluetoothd's LE crypto (signing, the GATT database hash) goes through AF_ALG sockets.
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y

# ---------------------------------------------------------------------------
# Tracing and debugging
# ---------------------------------------------------------------------------
CONFIG_DEBUG_FS=y
CONFIG_DYNAMIC_DEBUG=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y
CONFIG_DYNAMIC_FTRACE=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_MAGIC_SYSRQ=y

# ---------------------------------------------------------------------------
# Kernel trials (docs/kernel.md): every failure must end in a reset, which U-Boot turns into a
# boot of the good kernel.
# ---------------------------------------------------------------------------
# /proc/config.gz: what the running kernel was built with, test or good.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
# A panic reboots after 10 s (the trial boot's cmdline says panic=10 as well).
CONFIG_PANIC_TIMEOUT=10
# The SoC watchdog, built in: U-Boot arms it for a trial boot, and the driver has to take it over
# before it expires. systemd's RuntimeWatchdogSec then keeps it fed for as long as userspace
# lives (btbench-kernel's 10-btbench-watchdog.conf).
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y
CONFIG_BCM2835_WDT=y
# The last kernel log of a crashed or hung boot, read back from RAM after the reset
# (/sys/fs/pstore). The region is a reserved-memory node in the board's device tree. pstore sits
# in the "Miscellaneous filesystems" menu, which bcm2835_defconfig switches off.
CONFIG_MISC_FILESYSTEMS=y
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_PMSG=y
# Undervoltage alarm (in0_lcrit_alarm), which mainline has instead of vcgencmd get_throttled.
# A sagging supply corrupts the Bluetooth UART long before the board resets.
CONFIG_SENSORS_RASPBERRYPI_HWMON=y

# ---------------------------------------------------------------------------
# USB gadget: the dev link to the PC (btbench-gadget.service, configfs). Built in, so the link
# comes up without any module having to load first, including on a trial kernel whose modules
# are broken.
# ---------------------------------------------------------------------------
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_DUAL_ROLE=y
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ACM=y

# ---------------------------------------------------------------------------
# Wi-Fi: brcmfmac on SDIO, station and AP (hostapd, nl80211). cfg80211 is a module so that it
# loads after the root filesystem is mounted and finds regulatory.db (wireless-regdb-static).
# ---------------------------------------------------------------------------
CONFIG_CFG80211=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
# The Zero W has no analog audio: snd-aloop is the PCM the audio stacks play to and record from.
CONFIG_SND_ALOOP=m
# A USB audio interface, when the OTG port is a host.
CONFIG_SND_USB_AUDIO=m
# No HDMI audio. The mainline dts enables the GPU, and vc4 (vc4-hdmi) and the staging
# snd-bcm2835 (bcm2835-audio) then add two sound cards nothing on the bench listens to, which
# WirePlumber could pick as the default sink over snd-aloop. Off with them; the console on HDMI
# still works through simpledrm.
# CONFIG_DRM_VC4 is not set
# CONFIG_SND_BCM2835 is not set
