# bluetooth.service drop-in from meta-btbench (bluez5_git.bb).
#
# bluetoothd's command line comes from /data/btbench/bluetoothd.env, so debug logging (-d),
# experimental interfaces (-E) or kernel experimental features (-K) are switched from the web UI
# or `bench bt-args "-d -E"` with a restart, not a rebuild, and the choice survives deploys and
# kernel swaps. The file is shell KEY=VALUE:
#
#   BLUETOOTHD_ARGS="-d"
#
# -n is not needed under systemd: bluetoothd does not fork either way, and -n only copies every
# log line to stderr, which journald already gets through syslog, so each line shows up twice.
#
# BLUETOOTHD_NOPLUGIN keeps BlueZ's own hfp plugin (an HFP Hands-Free with its own SDP record and
# RFCOMM server) from loading. It is experimental, so main.conf's Experimental = true (needed for
# LE Audio) would load it, and it would then fight PipeWire's native HFP backend and BlueALSA's
# hfp-hf for the same role. To work on it, set BLUETOOTHD_NOPLUGIN= (empty) in the env file and
# take hfp_hf out of the audio stack's roles, or use audio mode "none".
[Service]
Environment=BLUETOOTHD_ARGS=
Environment=BLUETOOTHD_NOPLUGIN=--noplugin=hfp
EnvironmentFile=-/data/btbench/bluetoothd.env
ExecStart=
ExecStart=@LIBEXECDIR@/bluetooth/bluetoothd $BLUETOOTHD_NOPLUGIN $BLUETOOTHD_ARGS
