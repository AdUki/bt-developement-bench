# Configuration file locations:
# /etc/clog.conf
# /usr/share/clog/clog.conf
# ~/.clog
#
# Available keys:
#
# ExtendedColors
#  values: false|true|auto
#  default: auto
#  Use 256 color codes
#
# PagerCmd
#  default: less -R || more
#
# FollowCmd
#  default: tail -F
#
# ParseJson
#  value: false|true
#  default: true
#
# UsePager
#  value: false|true|auto
#  default: auto
#
# PrintElapsed
#  value: false|true
#  default: true
#  Print elapsed seconds and newlines between log lines
#
# MinElapsedSeconds
#  value: unsigned int
#  default: 5
#  When elapsed seconds is equal of greater that this value, elapsed log line is printed.
#
# MaxElapsedNewLines
#  value: unsigned int
#  default: 10
#  Maximum number of newlines between log lines
#
# ElapsedNewLineSeconds
#  value: unsigned int
#  default: 5
#  Elapsed seconds is divided by this value and result is number of newlines added between lines.
#
# FileRegexp
#  value: regular expression
#  Following keys are applied only when regexp matches with first argument/file
#  Use FileIRegexp to ignore case
#
# DefaultGroup
#  value: name of group
#  Use this group configuration when group was not specified
#
# ColorRegexp
#  value: regular expression
#  Create parser from regexp follow by defined captures
#  Use ColorIRegexp to ignore case
#
# 0-9
#  Number specifies index of submatch of ColorRegexp key
#  value:
#   - "black", red", "green", "yellow", "blue", "magenta", "cyan", "gray", "white"
#   - color code number according to https://misc.flogisoft.com/bash/tip_colors_and_formatting
#  You can further modify these colors by specifiers:
#   - "bold", "background", "dim", "light", "underline", "invert", "blink", "hidden"
#   - "line" color will be applied on whole line (note: color priority is reversed for this modifier)
#  There are special "colors" available:
#   - "hash" Color is calculated from hash number that is generated from captured text
#   - "time:<format>" time will be captured from log line and when there is big difference this time
#                     will be printed and some automatic spaces will be inserted.
#                     Format is according to https://man7.org/linux/man-pages/man3/strptime.3.html

DefaultGroup nsdk

Group alsa
	ColorRegexp "^ALSA lib"
		0 red_line

Group gstreamer
	# in some word separators are color escape sequences e.g. <ESC>[00m
	ColorRegexp "^(\d?\d:\d\d:\d\d)\.\d{9} [\d ]{5} 0x[0-9a-f]+ [A-Z]+ +(\S+) \S+\.[ch](?:pp)?:\d+\S+"
		0 green_line
		1 time:%Y%m%d %T
		2 hash

Group gobject
	ColorRegexp "^.{0,40}GLib-GObject-(:?(WARNING)|(ERROR)|(CRITICAL)):"
		1 yellow_line
		2 red_line
		6 red_background_line

# Example:
# 2022-02-09 07:55:16.985976 [AirPlay] HTTP Response: RTSP/1.0 200 OK
Group airplay
	FileRegexp "airplay"
	ColorRegexp "^(\d\d\d\d-\d\d-\d\d \d\d:\d\d:\d\d)\.\d{6} (\[\w+\])?"
		1 time:%Y-%m-%d %H:%M:%S
		2 hash

Group nsdkwatchdog
	ColorRegexp "^.{0,30}Watchdog: Starting app:"
		0 green_background_line

Group nsdklog
	ColorRegexp "^.*(###)"
		1 green_bold_background_line
	ColorRegexp "^(\d{8} \d\d:\d\d:\d\d)\.\d\d\d \[\d+\.\d+\] (?:(TRACE)|(DEBUG)|INFO|(WARN(?:ING)?)|(ERROR)|(FATAL)) (?:([^:/]+:)|([^/:]+/)([^:]*:))"
		1 time:%Y%m%d %T
		2 gray_line
		3 light_gray_line
		4 yellow_line
		5 red_line
		6 red_background_line
		7 hash
		8 hash
		9 hash

# Example:
# 20220403 11:35:59.169 [778.781] INFO Networking: Enter Networking::requestWifiResource: submodule 3 enable 0
Group nsdk
	FileRegexp "nSDK"
	Include nsdklog
	Include nsdkwatchdog
	Include alsa
	Include gstreamer
	Include gobject
	Include airplay

# Example:
# 20230109 05:47:55.750 [2481.2481] INFO DhcpClient.cpp:90 Dhcp output: "SCWD_NETMASK=255.255.240.0"
Group scwd
	FileRegexp "scwd"
	Include nsdklog
	Include nsdkwatchdog

# Example:
# I0513 04:52:55.140166    2045 mdns_app_filter.cc:3399] Mdns cast queries recently sent: queries=1
# [metrics_stat_logger] CastV2.Receiver.GetAppAvailability.Out=8
Group googlecastlite
	FileRegexp "cast\b"
	ColorRegexp "^(?:(D)|I|(W)|(E))\d+ (\d\d:\d\d:\d\d)\.\d{6} +\d+ (\S+):\d+\]"
		1 gray_line
		2 yellow_line
		3 red_line
		4 time:%T
		5 hash
	ColorRegexp "^\[\S+\] "
		0 gray_line

# Example:
# 1649400051.070940: dbus: Unregister BSS object '/fi/w1/wpa_supplicant1/Interfaces/0/BSSs/23'
Group wpasupplicant
	FileRegexp "wpasupplicant"
	Include nsdkwatchdog
	ColorRegexp "^(\d{10}).\d{6}: (\S+:)?"
		1 time:%s
		2 hash

# Example:
# bluetoothd[13077]: 20220309 12:06:48.280 DEBUG src/adapter.c:adapter_service_insert() /org/bluez/hci0
Group bluez
	FileRegexp "bluez"
	Include nsdkwatchdog
	ColorRegexp "^\S+ (\d{8} \d\d:\d\d:\d\d)\.\d\d\d (?:(DEBUG)|INFO|(WARN)|(ERROR)) (?:(\S+\.[ch]):)?"
		1 time:%Y%m%d %T
		2 light_gray_line
		3 yellow_line
		4 red_line
		5 hash

# Example:
# [I][10:44:56.111404] pw.conf      | [          conf.c:  423 conf_load()] 0x559bfffbe0: loaded config '/usr/share/pipewire/pipewire.conf' with 5 items
Group pipewire
	FileRegexp "pipewire"
	Include nsdkwatchdog
	ColorRegexp "^\[(?:-|(T|\*T\*)|(D)|I|(W)|(E))\]\[(\d?\d:\d\d:\d\d)\.\d{6}\]\s+(\S+)\s+\|\s+\[\s*([^:]+):"
		1 gray_line
		2 light_gray_line
		3 yellow_line
		4 red_line
		5 time:%T
		6 hash
		7 hash

# Example:
# I 16:45:19.152172    m-lua-scripting ../git/modules/module-lua-scripting/api/config.c:104:load_file: loading config file: /usr/share/wireplumber/sue-config.lua.d/00-functions.lua
Group wireplumber
	FileRegexp "wireplumber"
	Include nsdkwatchdog
	ColorRegexp "^(?:-|(T)|(D)|I|M|(W)|(E)|(C)|U) (\d{2}:\d{2}:\d{2})\.\d{6}\s+(\S+) [^:]+:[^:]+:[^:]+:"
		1 gray_line
		2 light_gray_line
		3 yellow_line
		4 red_line
		5 red_background_line
		6 time:%T
		7 hash

# Example:
# [00019.878731][0] bootstrap > Registering dsd subdec
# [00021.128012][1] om-dsp0 > Entering OM DSP (0) thread
Group imx8af
	FileRegexp "imx8af"
	Include nsdkwatchdog
	ColorRegexp "^\[(\d+)\.\d+\]\[\d+\] (\w+)(?:-\w+)? > "
		1 time:%s
		2 hash
	ColorIRegexp "\b(?:fatal|error|failed)\b"
		0 red_line
	ColorIRegexp "\b(:?warning|warn)\b"
		0 yellow_line
