# The SoC watchdog, built in: systemd keeps it fed (btbench.cfg, "Kernel trials"). The bench's
# U-Boot has no driver for it, so unlike on the Raspberry Pis a trial kernel that hangs before
# systemd starts is not reset by it: power-cycle the board, which then boots the good kernel.
CONFIG_MESON_GXBB_WATCHDOG=y

# The PWMs are the Wi-Fi/Bluetooth module's 32 kHz sleep clock and the CPU's supply: built in, so
# neither radio waits for a module to probe.
CONFIG_PWM_MESON=y

# No HDMI audio: the dts's sound card (axg-sound-card, TDM to HDMI) is one nothing on the bench
# listens to, and WirePlumber could pick it as the default sink over snd-aloop. HDMI video stays.
# CONFIG_SND_MESON_AXG_SOUND_CARD is not set
# CONFIG_SND_MESON_GX_SOUND_CARD is not set
