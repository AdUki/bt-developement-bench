# Kernel fragment for the Khadas VIM3L, merged after btbench.cfg and bt-debug.cfg over arm64's
# defconfig (linux-btbench and `make linux`).

# arm64's defconfig builds for every SoC it knows, a few thousand modules. Only Amlogic's: what
# depends on another SoC family goes with it, which halves the build and the modules the image
# carries. Generic drivers (USB devices, PCIe and network cards) stay.
