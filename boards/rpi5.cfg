# Kernel fragment for the Raspberry Pi 5, merged after btbench.cfg and bt-debug.cfg over arm64's
# defconfig (linux-btbench, `make linux`) and over bcm2712_defconfig (the linux-raspberrypi
# bbappend, KERNEL=rpi). Unlike boards/rpi.cfg it names symbols 6.12 does not have (MISC_RP1,
# IWLMLD, SoC families added since): the downstream tree's own RP1 and iwlwifi options are on in
# bcm2712_defconfig already. (KERNEL=rpi on this board has not been built yet.)

# arm64's defconfig builds for every SoC it knows. Only Broadcom's: BCM2835 for the firmware
# interface, the watchdog and the VideoCore clocks, BRCMSTB for the BCM2712's own blocks (the SD
# card's sdhci-brcmstb, the PCIe controllers, the 8250 UART the Bluetooth radio is on), which their
# Kconfig defaults switch on with it. Generic drivers (USB devices, PCIe and network cards) stay.
# CONFIG_ARCH_ACTIONS is not set
# CONFIG_ARCH_AIROHA is not set
# CONFIG_ARCH_ALPINE is not set
# CONFIG_ARCH_APPLE is not set
# CONFIG_ARCH_ARTPEC is not set
# CONFIG_ARCH_ASPEED is not set
# CONFIG_ARCH_AXIADO is not set
# CONFIG_ARCH_BCMBCA is not set
# CONFIG_ARCH_BCM_IPROC is not set
# CONFIG_ARCH_BERLIN is not set
# CONFIG_ARCH_BITMAIN is not set
# CONFIG_ARCH_BLAIZE is not set
# CONFIG_ARCH_BST is not set
# CONFIG_ARCH_CIX is not set
# CONFIG_ARCH_EXYNOS is not set
# CONFIG_ARCH_HISI is not set
# CONFIG_ARCH_INTEL_SOCFPGA is not set
# CONFIG_ARCH_K3 is not set
# CONFIG_ARCH_KEEMBAY is not set
# CONFIG_ARCH_LAN969X is not set
# CONFIG_ARCH_LAYERSCAPE is not set
# CONFIG_ARCH_LG1K is not set
# CONFIG_ARCH_MA35 is not set
# CONFIG_ARCH_MEDIATEK is not set
# CONFIG_ARCH_MESON is not set
# CONFIG_ARCH_MICROCHIP is not set
# CONFIG_ARCH_MMP is not set
# CONFIG_ARCH_MVEBU is not set
# CONFIG_ARCH_MXC is not set
# CONFIG_ARCH_NPCM is not set
# CONFIG_ARCH_NXP is not set
# CONFIG_ARCH_PENSANDO is not set
# CONFIG_ARCH_QCOM is not set
# CONFIG_ARCH_REALTEK is not set
# CONFIG_ARCH_RENESAS is not set
# CONFIG_ARCH_ROCKCHIP is not set
# CONFIG_ARCH_S32 is not set
# CONFIG_ARCH_SEATTLE is not set
# CONFIG_ARCH_SOPHGO is not set
# CONFIG_ARCH_SPARX5 is not set
# CONFIG_ARCH_SPRD is not set
# CONFIG_ARCH_STM32 is not set
# CONFIG_ARCH_SUNXI is not set
# CONFIG_ARCH_SYNQUACER is not set
# CONFIG_ARCH_TEGRA is not set
# CONFIG_ARCH_TESLA_FSD is not set
# CONFIG_ARCH_THUNDER is not set
# CONFIG_ARCH_THUNDER2 is not set
# CONFIG_ARCH_UNIPHIER is not set
# CONFIG_ARCH_VEXPRESS is not set
# CONFIG_ARCH_VISCONTI is not set
# CONFIG_ARCH_XGENE is not set
# CONFIG_ARCH_ZYNQMP is not set

# The SoC watchdog (the PM block's, bcm2835_wdt on the BCM2712 too), built in: systemd keeps it
# fed (btbench.cfg, "Kernel trials").
CONFIG_BCM2835_WDT=y

# Undervoltage alarm (in0_lcrit_alarm). The Pi 5 wants 5 V/5 A for full USB power; a PC's port or
# a 3 A supply is enough for the board and an M.2 card only while nothing much is on its USB.
CONFIG_SENSORS_RASPBERRYPI_HWMON=y

# The PCIe controllers, built in: pcie1 is the external FFC connector the M.2 HAT (and the BE200
# on it) hangs off, pcie2 the RP1 south bridge, which carries the USB host ports, Ethernet and the
# 40-pin header's GPIO and UARTs. Both then come up without waiting for a module, on a trial
# kernel whose modules are broken too.
CONFIG_PCIE_BRCMSTB=y
CONFIG_MISC_RP1=y
# The BCM2712's MSI-X interrupt peripheral (mip0), both controllers' msi-parent: a module in arm64's
# defconfig, and until it loads neither controller probes, so the RP1 and everything on it would
# wait for userspace after all.
CONFIG_BCM2712_MIP=y
# The RP1's pin controller and clocks, built in too. They default to MISC_RP1, a module in arm64's
# defconfig, and stay modules when this fragment turns it on. The 40-pin header's UART (the bench
# dtsi's rp1_uart0, a second console) needs both before it probes, and a console that waits for
# modules misses every boot that fails before they load.
CONFIG_PINCTRL_RP1=y
CONFIG_COMMON_CLK_RP1=y

# The Intel BE200's Wi-Fi on PCIe (8086:272b): iwlwifi with the MLD op mode, which drives the
# Wi-Fi 7 cards' firmware (btbench-firmware-iwlwifi). Its Bluetooth is a USB device on the M.2
# slot's USB pins, btusb + btintel (btbench.cfg's BT_HCIBTUSB selects BT_INTEL).
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
CONFIG_IWLMLD=m

# No HDMI audio (boards/rpi.cfg says why): vc4 on the BCM2712 adds HDMI sound cards WirePlumber
# could pick over snd-aloop. The console on HDMI still works through simpledrm.
# CONFIG_DRM_VC4 is not set

# Fan control (boards/dts/rpi5-btbench.dtsi): the RP1's PWM (a bench commit in src/linux) drives
# the fan connector, pwm-fan and the BCM2711's thermal driver (both modules in arm64's defconfig)
# step it with the SoC's temperature. Without them the fan runs at full speed all the time.
CONFIG_PWM_RP1=m
CONFIG_SENSORS_PWM_FAN=m
CONFIG_BCM2711_THERMAL=m
