# Kernel fragment for the Raspberry Pis (rpi0w, rpi4), merged after btbench.cfg and bt-debug.cfg
# by every kernel the bench builds for them: linux-btbench, the linux-raspberrypi bbappend and
# `make linux`. Only symbols both trees have.

# The SoC watchdog, built in: U-Boot arms it for a trial boot, and the driver has to take it over
# before it expires (btbench.cfg, "Kernel trials").
CONFIG_BCM2835_WDT=y

# Undervoltage alarm (in0_lcrit_alarm), which mainline has instead of vcgencmd get_throttled.
# A sagging supply corrupts the Bluetooth UART long before the board resets.
CONFIG_SENSORS_RASPBERRYPI_HWMON=y

# No HDMI audio. The mainline dts enables the GPU, and vc4 (vc4-hdmi) and the staging
# snd-bcm2835 (bcm2835-audio) then add two sound cards nothing on the bench listens to, which
# WirePlumber could pick as the default sink over snd-aloop. Off with them; the console on HDMI
# still works through simpledrm.
# CONFIG_DRM_VC4 is not set
# CONFIG_SND_BCM2835 is not set
